# Publica una versión nueva con los programas de Windows y macOS.
# Se activa al subir una etiqueta vX.Y.Z  (ej.: git tag v5.0.0 && git push origin v5.0.0)
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Comprobar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('ppf_tester/version.py',encoding='utf-8').read()).group(1))")
          if [ "$TAG" != "$CODE" ]; then echo "La etiqueta v$TAG no coincide con version.py ($CODE)"; exit 1; fi

      - name: Prueba rápida
        run: python ppf_tester/ppf_tester.py -h

      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: Construir PPF-Tester.exe
        run: python build.py

      - name: Crear instalador (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path ppf_tester/version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PPF-Tester-windows
          path: dist/*.zip

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PPF-Tester.exe
            dist/PPF-Tester-Setup-*.exe
            dist/*.zip
          generate_release_notes: true

  macos-app:
    runs-on: macos-latest
    needs: windows-exe          # después de Windows: la versión ya existe y solo se añade el .zip
    # si el Mac falla, la versión de Windows se publica igual
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v

      - name: Construir PPF Tester.app
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: PPF-Tester-macos
          path: dist/*-macos.zip

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-macos.zip
